  add({id:'current-location',track:'basics',title:t('現在地とパス','Your location and paths'),goal:t('現在地を確認して、作業用フォルダーへ移動する。','Check your location and move to the practice folder.'),

    task:t('Get-Location で現在地を表示してから、C:\\Lab に移動し、もう一度現在地を表示してください。','Display your location, move to C:\\Lab, then display your location again.'),example:{command:c`Set-Location -Path C:\Users\student\Documents`,note:t('課題では移動先を C:\\Lab に変えます。','Change the destination to C:\\Lab for the task.')},
    hints:[t('まず Get-Location を実行します。','Start with Get-Location.'),t('移動には Set-Location -Path を使います。','Use Set-Location -Path to move.'),t('Get-Location → Set-Location -Path C:\\Lab → Get-Location の順です。','Run Get-Location, Set-Location -Path C:\\Lab, then Get-Location.')],solution:['Get-Location',c`Set-Location -Path C:\Lab`,'Get-Location'],success:t('移動前と移動後の現在地を確認できました。','You checked your location before and after moving.'),verify:{orderedCommands:[cmd('Get-Location'),path('Set-Location',c`C:\Lab`),cmd('Get-Location',[],[c`C:\Lab`])],cwd:c`C:\Lab`}});

  add({id:'list-files',track:'basics',title:t('フォルダーの中を見る','List a folder'),goal:t('ファイルとフォルダーを区別して一覧を取得する。','List a folder and distinguish files from directories.'),
    explanation:[t('Get-ChildItem は指定した場所の中身を返します。-File ならファイルだけ、-Directory ならフォルダーだけです。-Recurse を付けたときだけ、子フォルダーの中も調べます。','Get-ChildItem returns the contents of a location. -File keeps files; -Directory keeps folders. -Recurse also inspects descendants.'),t('画面の表はオブジェクトの見せ方です。ファイルには Name、Length、LastWriteTime（最終更新日時）、FullName などの項目があり、後から項目を指定して調べられます。','The table is a display of objects. Files have properties such as Name, Length, LastWriteTime (last modification time), and FullName that you can inspect later.')],task:t('C:\\Lab の直下にあるファイルだけを表示してください。','List only the files directly inside C:\\Lab.'),example:{command:c`Get-ChildItem -Path C:\Lab -Directory`,note:t('この例はフォルダーだけです。課題ではファイルだけを選びます。','This example selects folders. Select files for the task.')},hints:[t('Get-ChildItem に場所を指定します。','Pass the location to Get-ChildItem.'),t('ファイルだけを選ぶ指定は -File です。','Use -File to select files.'),t('Get-ChildItem -Path C:\\Lab -File を実行します。','Run Get-ChildItem -Path C:\\Lab -File.')],solution:[c`Get-ChildItem -Path C:\Lab -File`],success:t('対象の階層と種類を指定できました。','You selected the intended level and item type.'),verify:{commands:[path('Get-ChildItem',c`C:\Lab`,['readme.txt','devices.csv'],['-File'])]}});

  add({id:'quoted-path',track:'basics',title:t('空白を含むパスを読む','Read a path containing spaces'),goal:t('空白を含むパスを引用符で一つの引数にする。','Quote a path containing spaces so it remains one argument.'),explanation:[t('空白を含むパスは引用符で囲み、一つの引数として渡します。PowerShell のバックスラッシュは文字列のエスケープ文字ではありません。','Quote a path containing spaces so it is passed as one argument. The backslash is not PowerShell’s string escape character.'),t('空白だけなら -Path と引用符で指定できます。-LiteralPath は guide[1].txt のように [ ] を含む名前を、ワイルドカードとして解釈させずに使うための指定です。単一引用符は基本的に文字をそのまま、二重引用符は変数などを展開します。','For spaces alone, -Path with quotes is sufficient. -LiteralPath is useful for names such as guide[1].txt, where brackets must not be interpreted as wildcards. Single quotes are literal; double quotes can expand variables.')],task:t('C:\\Lab\\Shared Files\\guide.txt を、パス全体を引用符で囲んで読んでください。','Read C:\\Lab\\Shared Files\\guide.txt, enclosing the entire path in quotes.'),example:{command:c`Get-Content -Path 'C:\Lab\readme.txt'`,note:t('課題のパスには空白が含まれます。引用符も入力します。','The task’s path includes a space. Include the quotes.')},hints:[t('内容を読むコマンドは Get-Content です。','Get-Content reads file contents.'),t('パス全体を単一引用符または二重引用符で囲みます。','Enclose the entire path in single or double quotes.'),t("Get-Content -Path 'C:\\Lab\\Shared Files\\guide.txt' を実行します。","Run Get-Content -Path 'C:\\Lab\\Shared Files\\guide.txt'.")],solution:[c`Get-Content -Path 'C:\Lab\Shared Files\guide.txt'`],success:t('空白で分かれないよう、正確なファイル名を渡せました。','You passed the exact filename as a single argument.'),verify:{commands:[path('Get-Content',c`C:\Lab\Shared Files\guide.txt`,['Quote paths containing spaces.'])]}});

  add({id:'tail-log',track:'basics',title:t('ログの末尾を読む','Read the end of a log'),goal:t('長いファイルの必要な部分を確認する。','Read the relevant part of a long file.'),explanation:[t('Get-Content は通常、テキストを行ごとに返します。-Tail 2 は最後の 2 行、-TotalCount 2 は最初の 2 行です。-Raw はファイル全体を一つの文字列として返します。','Get-Content normally emits one string per line. -Tail 2 reads the last two lines; -TotalCount 2 reads the first two. -Raw returns the whole file as one string.'),t('後ろの行ほど新しいかどうかは、ログの形式によります。この演習は時刻順です。再試行の予定と、実際の成功記録は別の情報です。','Whether later lines are newer depends on the log format. This exercise is chronological. A scheduled retry and a recorded success are different facts.')],task:t('C:\\Lab\\Logs\\app.log の最後の 2 行を表示し、何が分かるか選んでください。','Display the last two lines of C:\\Lab\\Logs\\app.log and interpret them.'),example:{command:c`Get-Content -Path C:\Lab\Logs\app.log -TotalCount 2`,note:t('この例は先頭です。末尾の指定へ変えます。','This reads the beginning. Change it to read the end.')},hints:[t('Get-Content にログのパスを渡します。','Pass the log path to Get-Content.'),t('最後から読むには -Tail を使います。Get-Content の出力を Select-Object -Last 2 に渡す方法もあります。','Use -Tail to read the end. Another option is to pipe Get-Content to Select-Object -Last 2.'),t('Get-Content -Path C:\\Lab\\Logs\\app.log -Tail 2 を実行します。','Run Get-Content -Path C:\\Lab\\Logs\\app.log -Tail 2.')],solution:[c`Get-Content -Path C:\Lab\Logs\app.log -Tail 2`],success:t('失敗と再試行予定を、成功の記録と区別できました。','You distinguished a failure and a retry plan from evidence of success.'),verify:{pipelines:[{anyOf:[[{...path('Get-Content',c`C:\Lab\Logs\app.log`,['Job failed','Retry scheduled'],['-Tail','2']),outputCount:2}],[path('Get-Content',c`C:\Lab\Logs\app.log`),{...cmd('Select-Object',['-Last','2'],['Job failed','Retry scheduled']),outputCount:2}]]}]},question:quiz('この 2 行から分かることは？','What do these two lines establish?',option('ジョブは失敗し、その後の再試行が予定された。','The job failed and a later retry was scheduled.','Retry scheduled は予定です。完了を示す行はありません。','Retry scheduled is a plan. Neither line records completion.'),option('09:10 に再試行が完了し、印刷が復旧した。','The retry completed at 09:10 and printing recovered.','scheduled は完了を意味しません。実行結果が別途必要です。','Scheduled does not mean completed. You still need the outcome.'),option('09:08 のエラーは、09:10 に取り消された。','The 09:08 error was canceled at 09:10.','後続の予定は過去のエラーを取り消しません。','A later plan does not cancel an earlier error.'))});

  add({id:'test-path',track:'basics',title:t('存在と内容を分ける','Existence is not content'),goal:t('True / False が答えている問いを見分ける。','Understand the question answered by True or False.'),explanation:[t('Test-Path は指定したパスが存在するかを調べます。True は内容が正しいという意味でも、書き込みができるという意味でもありません。','Test-Path checks whether a path exists. True does not establish that its contents are correct or that you can write there.'),t('存在の確認と内容の確認は別の操作です。今回はファイルがあることを確認してから、Get-Item で名前と場所を確認します。','Existence and content are separate checks. Here, first verify existence, then inspect the item’s name and location.')],task:t('C:\\Lab\\notes.txt の存在を Test-Path で確認し、Get-Item で情報を表示してください。','Check C:\\Lab\\notes.txt with Test-Path, then inspect it with Get-Item.'),example:{command:c`Test-Path -Path C:\Lab\readme.txt`,note:t('戻り値は真偽値です。課題では notes.txt を指定します。','The result is Boolean. Use notes.txt for the task.')},hints:[t('Test-Path の後ろに対象を指定します。','Pass the target to Test-Path.'),t('同じファイルを Get-Item で調べます。','Inspect the same file with Get-Item.'),t('Test-Path C:\\Lab\\notes.txt、Get-Item C:\\Lab\\notes.txt の順です。','Run Test-Path C:\\Lab\\notes.txt, then Get-Item C:\\Lab\\notes.txt.')],solution:[c`Test-Path -Path C:\Lab\notes.txt`,c`Get-Item -Path C:\Lab\notes.txt`],success:t('存在とファイルの情報を別々に確認できました。','You checked existence and item details separately.'),verify:{commands:[path('Test-Path',c`C:\Lab\notes.txt`,['True']),path('Get-Item',c`C:\Lab\notes.txt`,['notes.txt'])]}});

  add({id:'write-and-append',track:'basics',title:t('メモを作り、追記する','Create and append a note'),goal:t('上書きと追記を使い分け、結果を読み戻す。','Distinguish replacement from appending, then read the result.'),explanation:[t('New-Item -ItemType Directory はフォルダーを作ります。Set-Content は内容を置き換え、Add-Content は既存の内容の後ろへ追加します。','New-Item -ItemType Directory creates a folder. Set-Content replaces contents; Add-Content appends to existing contents.'),t('保存できたと思ったら、同じファイルを読み戻します。ここでは実ファイルではなく、このレッスン専用の仮想ファイルだけが変わります。','Read the same file back to verify a write. These operations change only this lesson’s virtual files.')],task:t('C:\\Lab\\Notes を作り、ticket.txt に「Ticket 1042」を保存して「Checked files」を追記し、読み戻してください。','Create C:\\Lab\\Notes. Write “Ticket 1042” to ticket.txt, append “Checked files”, then read it back.'),example:{command:c`Set-Content -Path C:\Lab\Reports\memo.txt -Value 'Investigation started'`,note:t('既存の内容は置き換わります。追記は Add-Content です。','This replaces existing content. Use Add-Content to append.')},hints:[t('New-Item で Notes フォルダーを作ります。','Create the Notes folder with New-Item.'),t('Set-Content と Add-Content は -Value に本文を指定します。','Use -Value for the text with Set-Content and Add-Content.'),t('New-Item -Path C:\\Lab\\Notes -ItemType Directory の後、ticket.txt に Set-Content、Add-Content、Get-Content を使います。','After New-Item -Path C:\\Lab\\Notes -ItemType Directory, use Set-Content, Add-Content, and Get-Content on ticket.txt.')],solution:[c`New-Item -Path C:\Lab\Notes -ItemType Directory`,c`Set-Content -Path C:\Lab\Notes\ticket.txt -Value 'Ticket 1042'`,c`Add-Content -Path C:\Lab\Notes\ticket.txt -Value 'Checked files'`,c`Get-Content -Path C:\Lab\Notes\ticket.txt`],success:t('上書き・追記・読み戻しを一組で実行できました。','You created, appended, and verified the note.'),verify:{commands:[path('New-Item',c`C:\Lab\Notes`,[],['Directory']),path('Set-Content',c`C:\Lab\Notes\ticket.txt`),path('Add-Content',c`C:\Lab\Notes\ticket.txt`),path('Get-Content',c`C:\Lab\Notes\ticket.txt`,['Ticket 1042','Checked files'])],files:[{path:c`C:\Lab\Notes\ticket.txt`,includes:['Ticket 1042','Checked files']}]}});

  add({id:'copy-a-file',track:'basics',title:t('原本を残してコピーする','Copy while keeping the original'),goal:t('原本と作業用コピーを区別する。','Distinguish the original from a working copy.'),explanation:[t('Copy-Item はファイルをコピーします。-Path が元、-Destination が保存先です。Move-Item と違い、元のファイルは残ります。','Copy-Item copies a file. -Path is the source and -Destination the destination. Unlike Move-Item, it leaves the original in place.'),t('別名を含む保存先を指定すると、その名前でコピーされます。既存ファイルを置き換える可能性があるため、作業先を確認してから使います。','A destination that includes a new filename creates a copy with that name. Check the destination first because an existing file may be replaced.')],task:t('C:\\Lab\\notes.txt を C:\\Lab\\Reports\\notes-copy.txt へコピーし、コピーを読んでください。','Copy C:\\Lab\\notes.txt to C:\\Lab\\Reports\\notes-copy.txt and read the copy.'),example:{command:c`Copy-Item -Path C:\Lab\readme.txt -Destination C:\Lab\Reports\readme-copy.txt`,note:t('元と先のパスを、それぞれ課題に合わせます。','Change both paths to match the task.')},hints:[t('-Path には notes.txt を指定します。','Use notes.txt for -Path.'),t('-Destination に新しいファイル名まで書きます。','Include the new filename in -Destination.'),t('Copy-Item -Path C:\\Lab\\notes.txt -Destination C:\\Lab\\Reports\\notes-copy.txt の後、保存先を Get-Content で読みます。','Copy to C:\\Lab\\Reports\\notes-copy.txt, then read that path with Get-Content.')],solution:[c`Copy-Item -Path C:\Lab\notes.txt -Destination C:\Lab\Reports\notes-copy.txt`,c`Get-Content -Path C:\Lab\Reports\notes-copy.txt`],success:t('原本を残したまま作業用コピーを確認できました。','You verified a working copy while keeping the original.'),verify:{commands:[path('Copy-Item',[c`C:\Lab\notes.txt`,c`C:\Lab\Reports\notes-copy.txt`]),path('Get-Content',c`C:\Lab\Reports\notes-copy.txt`,['Ticket 1042'])],files:[{path:c`C:\Lab\notes.txt`,includes:['Ticket 1042']},{path:c`C:\Lab\Reports\notes-copy.txt`,includes:['Ticket 1042']}]}});

  add({id:'move-and-rename',track:'basics',title:t('移動と名前の変更','Move and rename a file'),goal:t('場所を変える操作と名前を変える操作を区別する。','Distinguish relocating a file from changing its name.'),explanation:[t('Move-Item はファイルの場所を変えます。Rename-Item は同じ場所で名前を変えます。-NewName には移動先フォルダーを含めません。','Move-Item relocates a file. Rename-Item changes its name in the same location. Do not put a destination folder in -NewName.'),t('操作をやり直すとき、元の名前は既に存在しないことがあります。仮想ファイル一覧や Get-ChildItem で現在の場所を確認してください。「このレッスンをリセット」で初期状態にも戻せます。','When retrying an operation, the old name may already be gone. Check the current location with Get-ChildItem or the virtual-file list. Resetting the lesson also restores its initial state.')],task:t('Move-Item で C:\\Lab\\notes.txt を Archive フォルダーへ移動し、Rename-Item で ticket-1042.txt に変更して、読み戻してください。','Use Move-Item to move C:\\Lab\\notes.txt into Archive, then Rename-Item to name it ticket-1042.txt. Read it back.'),example:{command:c`Rename-Item -Path C:\Lab\readme.txt -NewName guide.txt`,note:t('名前だけを変える例です。場所を変えるには Move-Item を使います。','This changes only the name. Use Move-Item to change location.')},hints:[t('移動先は C:\\Lab\\Archive です。','The destination folder is C:\\Lab\\Archive.'),t('名前変更の対象は、移動後の C:\\Lab\\Archive\\notes.txt です。','Rename C:\\Lab\\Archive\\notes.txt after the move.'),t('Move-Item の後、Rename-Item -Path C:\\Lab\\Archive\\notes.txt -NewName ticket-1042.txt を使い、新しいパスを読みます。','After Move-Item, run Rename-Item -Path C:\\Lab\\Archive\\notes.txt -NewName ticket-1042.txt, then read the new path.')],solution:[c`Move-Item -Path C:\Lab\notes.txt -Destination C:\Lab\Archive`,c`Rename-Item -Path C:\Lab\Archive\notes.txt -NewName ticket-1042.txt`,c`Get-Content -Path C:\Lab\Archive\ticket-1042.txt`],success:t('移動と名前変更の役割を分け、最終ファイルを確認できました。','You used each operation for its purpose and verified the final file.'),verify:{orderedCommands:[path('Move-Item',c`C:\Lab\notes.txt`),path('Rename-Item',c`C:\Lab\Archive\notes.txt`,[],['ticket-1042.txt']),path('Get-Content',c`C:\Lab\Archive\ticket-1042.txt`,['Ticket 1042'])],files:[{path:c`C:\Lab\Archive\ticket-1042.txt`,includes:['Ticket 1042']}]}});

  add({id:'discover-properties',track:'objects',title:t('表の裏にある項目','Discover properties behind the table'),goal:t('Get-Member でオブジェクトの型と項目を調べる。','Inspect object types and properties with Get-Member.'),
    explanation:[t('PowerShell のパイプ | は、通常、画面に並んだ文字ではなくオブジェクトを次へ渡します。Get-Process が返すものには ProcessName、Id、CPU などの項目があります。Name は ProcessName、WS は WorkingSet64 の別名で、それぞれ同じ値を取り出せます。','A PowerShell pipe normally passes objects to the next command, rather than the characters shown on screen. Get-Process objects have properties such as ProcessName, Id, and CPU. Name aliases ProcessName, and WS aliases WorkingSet64; each returns its source property’s value.'),t('Get-Member は、届いたオブジェクトの型や利用できる項目を調べます。表示されていない項目も調べられることが、テキストを探す操作との違いです。','Get-Member inspects the type and available members of incoming objects. You can discover properties that are absent from the default display.')],task:t('Get-Process の結果を Get-Member にパイプで渡し、項目を確認してください。','Pipe Get-Process into Get-Member and inspect the properties.'),example:{command:'Get-Service | Get-Member',note:t('サービスの型を調べる例です。課題ではプロセスを調べます。','This inspects services. Inspect processes for the task.')},hints:[t('コマンド同士を | でつなぎます。','Connect the commands with |.'),t('左側は Get-Process、右側は Get-Member です。','Put Get-Process on the left and Get-Member on the right.'),t('Get-Process | Get-Member を実行します。','Run Get-Process | Get-Member.')],solution:['Get-Process | Get-Member'],success:t('見えている列だけでなく、扱える項目を調べられました。','You discovered available properties beyond the visible columns.'),verify:{pipelines:[[cmd('Get-Process'),cmd('Get-Member',[],['ProcessName','CPU'])]]},question:quiz('パイプで Get-Member に渡ったものは？','What reached Get-Member through the pipe?',option('プロセスの項目を持つオブジェクト。','Objects with process properties.','項目を指定して絞り込みや並べ替えができます。','Their properties can be used for filtering and sorting.'),option('ターミナルに表示された表の画像。','An image of the terminal table.','画面の画像ではなく、値と項目を持つデータです。','The pipeline carries values and properties, not a picture.'),option('列幅を含めて整形済みの文字列。','Strings already padded to the table’s column widths.','通常の Get-Process は整形前のオブジェクトを返します。','Get-Process normally emits objects before display formatting.'))});

  add({id:'select-properties',track:'objects',title:t('必要な項目を選ぶ','Select the properties you need'),goal:t('Select-Object で確認する項目を絞る。','Choose useful properties with Select-Object.'),explanation:[t('Select-Object -Property は各オブジェクトから指定した項目を選びます。複数項目はカンマで区切ります。行を条件で絞る Where-Object とは役割が違います。','Select-Object -Property chooses named properties from each object. Separate multiple names with commas. Where-Object filters rows instead.'),t('Id と ProcessName を一緒に残すと、同名のアプリが複数あっても今回の実行を識別しやすくなります。この教材にも svchost や msedge が複数あり、それぞれ ID が異なります。','Keeping Id and ProcessName together helps distinguish running instances with the same name. This room includes several svchost and msedge processes, each with a different ID.')],task:t('Get-Process の結果から ProcessName と Id だけを選んで表示してください。','Select only ProcessName and Id from Get-Process.'),example:{command:'Get-Process | Select-Object -Property ProcessName,CPU',note:t('課題では CPU を Id に変えます。','Replace CPU with Id for the task.')},hints:[t('Get-Process からパイプで渡します。','Pipe from Get-Process.'),t('使うのは Select-Object -Property です。','Use Select-Object -Property.'),t('Get-Process | Select-Object -Property ProcessName,Id を実行します。','Run Get-Process | Select-Object -Property ProcessName,Id.')],solution:['Get-Process | Select-Object -Property ProcessName,Id'],success:t('調査に必要な項目を選べました。','You selected the properties needed for the investigation.'),verify:{pipelines:[[cmd('Get-Process'),cmd('Select-Object',['ProcessName,Id'],['NotesApp','4320'])]]}});

  add({id:'filter-objects',track:'objects',title:t('条件に合う行を選ぶ','Filter rows by a condition'),goal:t('Where-Object で停止中のサービスを抽出する。','Filter stopped services with Where-Object.'),explanation:[t('Where-Object は条件に合うオブジェクトだけを通します。Status -eq Stopped は Status が Stopped と等しいという比較です。','Where-Object passes only objects that satisfy a condition. Status -eq Stopped compares the Status property with Stopped.'),t('停止しているサービスがすべて異常とは限りません。使わない機能のため意図的に停止・無効化されている場合があります。','A stopped service is not necessarily faulty. Unused features can be intentionally stopped or disabled.')],task:t('Get-Service の結果から Status が Stopped のサービスを抽出してください。','Filter Get-Service to services whose Status is Stopped.'),example:{command:'Get-Service | Where-Object Status -eq Running',note:t('条件の値を Stopped に変えます。','Change the comparison value to Stopped.')},hints:[t('Get-Service を Where-Object へ渡します。','Pipe Get-Service to Where-Object.'),t('比較演算子は -eq です。','Use the -eq comparison operator.'),t('Get-Service | Where-Object Status -eq Stopped を実行します。','Run Get-Service | Where-Object Status -eq Stopped.')],solution:['Get-Service | Where-Object Status -eq Stopped'],success:t('行を選ぶ操作と、選ばれた理由を確認できました。','You filtered the rows and checked why they were selected.'),verify:{pipelines:[[cmd('Get-Service'),{...cmd('Where-Object',[],['RemoteRegistry','Stopped']),outputExcludes:['Spooler','Dnscache']}]]},question:quiz('RemoteRegistry が Stopped と表示されました。どう読む？','RemoteRegistry is Stopped. How should you interpret it?',option('停止という状態を確認した。必要性や起動設定は別に調べる。','It is stopped; check whether it is needed and how startup is configured.','停止という事実だけでは故障と断定できません。','The stopped state alone does not establish a fault.'),option('一覧から選ばれたので、起動操作も実行された。','Being selected means a start operation was also performed.','Where-Object は抽出であり、サービスの開始ではありません。','Where-Object filters data; it does not start services.'),option('Stopped は使用者がいないことを示し、サービス自体は稼働中。','Stopped means no users are active while the service is still running.','Stopped はサービスが停止中という状態です。','Stopped describes the service state, not its user count.'))});

  add({id:'sort-and-first',track:'objects',title:t('並べ替えて上位を見る','Sort and inspect the top result'),goal:t('Sort-Object と -First を組み合わせる。','Combine Sort-Object with -First.'),explanation:[t('Sort-Object は項目の値で並べ替えます。-Descending は大きい順です。その後の Select-Object -First 1 は先頭の 1 件を選びます。','Sort-Object orders objects by a property. -Descending puts larger values first. Select-Object -First 1 then keeps the first object.'),t('Get-Process の CPU はプロセスが累積で使った CPU 秒です。今この瞬間の CPU 使用率ではありません。長く動くプロセスほど大きくなることがあります。','The CPU property from Get-Process is cumulative processor time in seconds, not current CPU utilization. Longer-running processes can accumulate larger values.')],task:t('Get-Process を CPU の大きい順に並べ、先頭の 1 件を表示してください。','Sort Get-Process by CPU descending and display the first object.'),example:{command:'Get-Process | Sort-Object -Property CPU -Descending',note:t('この後に先頭 1 件の選択をつなぎます。','Add a selection of the first object after this sort.')},hints:[t('並べ替えの項目は CPU です。','Sort by CPU.'),t('-Descending と Select-Object -First 1 を使います。','Use -Descending and Select-Object -First 1.'),t('Get-Process | Sort-Object CPU -Descending | Select-Object -First 1 です。','Run Get-Process | Sort-Object CPU -Descending | Select-Object -First 1.')],solution:['Get-Process | Sort-Object -Property CPU -Descending | Select-Object -First 1'],success:t('順序と件数を指定し、数値の意味も確認できました。','You controlled order and count while understanding the number.'),verify:{pipelines:[[cmd('Get-Process'),cmd('Sort-Object',['CPU','-Descending']),cmd('Select-Object',['-First','1'],['NotesApp'])]]},question:quiz('NotesApp の CPU が最大です。言えることは？','NotesApp has the largest CPU value. What does that establish?',option('取得時点の累積 CPU 秒が、この一覧では最大。','It has the most accumulated CPU seconds in this snapshot.','瞬間的な負荷や応答不能の原因までは分かりません。','This does not establish current load or the cause of unresponsiveness.'),option('取得した瞬間に CPU を 125% 使用している。','It is using 125% CPU at the instant of collection.','CPU の単位は累積秒で、割合ではありません。','CPU is cumulative seconds, not a percentage.'),option('WorkingSet64 も全プロセス中で最大だと分かる。','Its WorkingSet64 must also be the largest of all processes.','CPU で並べ替えた結果だけでは、別の項目の順位は決まりません。','Sorting by CPU does not establish the ranking of another property.'))});

  add({id:'measure-objects',track:'objects',title:t('件数と合計を求める','Count and sum values'),goal:t('Measure-Object でファイル数と合計サイズを調べる。','Use Measure-Object to count files and sum their sizes.'),explanation:[t('Measure-Object は件数や合計、平均などを返します。-Property Length -Sum ならファイルの Length を合計します。Length はバイト数です。','Measure-Object returns counts and aggregates. -Property Length -Sum adds file lengths, measured in bytes.'),t('フォルダーは Length を持ちません。集計前に -File を指定すると対象が明確になります。Logs 直下はファイルだけなので、この課題では省略しても同じ結果です。PowerShell 7.3 以降の通常設定では、指定プロパティのない項目は集計から除外されます。','Directories do not have Length. Use -File to make the target set explicit. This Logs folder contains only files, so omitting it gives the same result here. Since PowerShell 7.3, items without the requested property are skipped under normal settings.')],task:t('C:\\Lab\\Logs 直下のファイルを取得し、Length の合計を Measure-Object で求めてください。','Get the files directly in C:\\Lab\\Logs and sum their Length using Measure-Object.'),example:{command:c`Get-ChildItem -Path C:\Lab -File | Measure-Object`,note:t('この例は件数です。課題では場所と集計する項目を指定します。','This counts files. Change the location and specify the property to sum.')},hints:[t('Get-ChildItem に -File を付けます。','Add -File to Get-ChildItem.'),t('Measure-Object -Property Length -Sum へ渡します。','Pipe to Measure-Object -Property Length -Sum.'),t('Get-ChildItem C:\\Lab\\Logs -File | Measure-Object -Property Length -Sum です。','Run Get-ChildItem C:\\Lab\\Logs -File | Measure-Object -Property Length -Sum.')],solution:[c`Get-ChildItem -Path C:\Lab\Logs -File | Measure-Object -Property Length -Sum`],success:t('集計対象と単位をそろえて合計を取得できました。','You measured a defined set using a consistent unit.'),verify:{pipelines:[either([path('Get-ChildItem',c`C:\Lab\Logs`,[],['-File']),{...cmd('Measure-Object',['Length','-Sum'],['Count','Sum']),objectIncludes:[{Count:2,Property:'Length'}]}],[{...path('Get-ChildItem',c`C:\Lab\Logs`),outputType:'System.IO.FileInfo'},{...cmd('Measure-Object',['Length','-Sum'],['Count','Sum']),objectIncludes:[{Count:2,Property:'Length'}]}])]}});

  add({id:'group-objects',track:'objects',title:t('同じ値でまとめる','Group matching values'),goal:t('状態別にまとめて件数を比較する。','Group by status and compare counts.'),explanation:[t('Group-Object は指定項目の値が同じオブジェクトをまとめます。Count はそのグループの件数、Name はグループの値です。','Group-Object groups objects sharing the same property value. Count is the size of the group; Name is the grouped value.'),t('件数の増減は調査の入口です。どのサービスが含まれるかを確認するには、元の一覧を Where-Object などで調べます。','Counts are a starting point. To identify the services in a group, filter the original list.')],task:t('Get-Service を Status ごとにまとめてください。','Group Get-Service by Status.'),example:{command:'Get-Service | Group-Object -Property StartType',note:t('課題では起動設定でなく、現在の状態でまとめます。','For the task, group by current status rather than startup mode.')},hints:[t('使うコマンドは Group-Object です。','Use Group-Object.'),t('項目名は Status です。','The property is Status.'),t('Get-Service | Group-Object -Property Status を実行します。','Run Get-Service | Group-Object -Property Status.')],solution:['Get-Service | Group-Object -Property Status'],success:t('状態ごとのまとまりを取得できました。','You obtained groups for each status.'),verify:{pipelines:[[cmd('Get-Service'),cmd('Group-Object',['Status'],['Running','Stopped','Count'])]]}});

  add({id:'save-variable',track:'objects',title:t('結果を変数に置く','Keep a result in a variable'),goal:t('同じ取得結果を繰り返し調べる。','Inspect the same captured result more than once.'),explanation:[t('$procs = Get-Process の = は代入です。取得したオブジェクトを変数に置きます。代入しただけでは通常、結果は画面に表示されません。','In $procs = Get-Process, = assigns the captured objects to a variable. Assignment normally produces no displayed output.'),t('変数の結果を後で読み直しても、Get-Process を再実行したことにはなりません。この教材では取得時点の写しとして保持します。最新状態を調べるときは取得し直します。','Reading the variable is not another execution of Get-Process. This simulator keeps a snapshot. Run the command again when you need a fresh observation.')],task:t('Get-Process の結果を $procs に代入し、その $procs を Select-Object へ渡して ProcessName と Id を表示してください。','Assign Get-Process to $procs, then pipe $procs to Select-Object to show ProcessName and Id.'),example:{command:'$services = Get-Service',note:t('結果に名前を付ける例です。課題では $procs を使います。','This gives a name to a result. Use $procs for the task.')},hints:[t('$procs = Get-Process で取得します。','Capture the result with $procs = Get-Process.'),t('次の入力は $procs から始めます。','Begin the next input with $procs.'),t('$procs | Select-Object -Property ProcessName,Id を実行します。','Run $procs | Select-Object -Property ProcessName,Id.')],solution:['$procs = Get-Process','$procs | Select-Object -Property ProcessName,Id'],success:t('取得した結果を変数から再利用できました。','You reused the captured result from a variable.'),verify:{commands:[cmd('Get-Process')],pipelines:[[cmd('$procs'),cmd('Select-Object',['ProcessName,Id'],['NotesApp'])]]},question:quiz('同じ変数を再表示するときの注意は？','What matters when displaying the variable again?',option('コマンドを取得し直したかどうかを区別する。','Distinguish reusing a result from running a fresh query.','変数の再利用だけでは、取得コマンドの再実行になりません。','Reusing a variable does not rerun its original command.'),option('変数名が同じなら、毎回 Get-Process が自動実行される。','The same variable name automatically reruns Get-Process each time.','変数には結果を代入しました。コマンドそのものの再実行指定ではありません。','The variable holds a result, not an instruction to rerun the command.'),option('代入はデータを CSV ファイルへ保存する操作。','Assignment saves the data to a CSV file.','変数とファイルは別です。CSV 保存には Export-Csv を使います。','Variables and files are different. Export-Csv writes a CSV file.'))});

  add({id:'each-property',track:'objects',title:t('一件ずつ取り出す','Process items one at a time'),goal:t('ForEach-Object と $_ の役割を知る。','Understand ForEach-Object and $_.'),explanation:[t('ForEach-Object はパイプで届いたオブジェクトを一件ずつ処理します。{ } の中の $_ は、いま処理している一件です。','ForEach-Object processes pipeline objects one at a time. Inside { }, $_ is the current object.'),t('Name の抽出だけなら Select-Object -ExpandProperty Name とも書けます。ここでは、一件ごとの処理を組み立てる準備として { $_.Name } で現在の一件を参照する書式を練習します。この教材で使えるブロックは単純な項目抽出までです。','For property extraction alone, Select-Object -ExpandProperty Name also works. Here, practice { $_.Name } to reference the current object as a first step toward per-item processing. This room limits these blocks to simple property extraction.')],task:t('C:\\Lab 直下のファイルを取得し、ForEach-Object で Name だけを一件ずつ返してください。','Get files directly in C:\\Lab and return each Name using ForEach-Object.'),example:{command:'Get-Service | ForEach-Object { $_.Name }',note:t('サービスの名前を取り出す例です。課題ではファイルを使います。','This extracts service names. Use files for the task.')},hints:[t('左側は Get-ChildItem C:\\Lab -File です。','Start with Get-ChildItem C:\\Lab -File.'),t('ForEach-Object の後に { $_.Name } と書きます。','Follow ForEach-Object with { $_.Name }.'),t('Get-ChildItem C:\\Lab -File | ForEach-Object { $_.Name } を実行します。','Run Get-ChildItem C:\\Lab -File | ForEach-Object { $_.Name }.')],solution:[c`Get-ChildItem -Path C:\Lab -File | ForEach-Object { $_.Name }`],success:t('現在の一件から値を取り出せました。','You extracted a value from each current object.'),verify:{pipelines:[[path('Get-ChildItem',c`C:\Lab`,[],['-File']),cmd('ForEach-Object',[],['readme.txt','devices.csv'])]]}});

  add({id:'format-last',track:'objects',title:t('見せ方は最後に整える','Format at the end'),goal:t('データを選ぶ操作と、画面の見せ方を分ける。','Separate selecting data from formatting its display.'),explanation:[t('Format-Table と Format-List は画面表示を整えるコマンドです。Format-List は一件の各項目を縦に並べるので、横に長い値を読むときに便利です。','Format-Table and Format-List format display output. Format-List lays properties out vertically and can make long values easier to inspect.'),t('Format-* の後ろには元のオブジェクトではなく表示用データが流れます。CSV にしたいときは Select-Object から Export-Csv へ渡します。この教材は Format-* 後のデータ処理を未対応として止めます。','Format-* emits formatting records rather than the original objects. For CSV, pipe Select-Object to Export-Csv. This simulator rejects downstream data processing after Format-*.')],task:t('Spooler のサービスを取得し、Name、Status、StartType を Format-List で表示してください。','Get the Spooler service and use Format-List to display Name, Status, and StartType.'),example:{command:'Get-Service -Name Spooler | Format-Table -Property Name,Status',note:t('課題では縦に並べ、起動設定も表示します。','For the task, use a vertical list and include startup mode.')},hints:[t('Get-Service -Name Spooler で対象を選びます。','Select the target with Get-Service -Name Spooler.'),t('Format-List -Property を使います。','Use Format-List -Property.'),t('Get-Service -Name Spooler | Format-List -Property Name,Status,StartType です。','Run Get-Service -Name Spooler | Format-List -Property Name,Status,StartType.')],solution:['Get-Service -Name Spooler | Format-List -Property Name,Status,StartType'],success:t('データの加工を終えてから、読みやすい表示にできました。','You formatted the result after choosing the data.'),verify:{pipelines:[[cmd('Get-Service',['Spooler']),cmd('Format-List',['Name,Status,StartType'],['Spooler','Running','Automatic'])]]},question:quiz('同じ項目を CSV 保存するなら？','How should you save these properties as CSV?',option('Select-Object で項目を選び、Export-Csv へ渡す。','Select the properties with Select-Object, then use Export-Csv.','保存には元の項目を持つデータを渡します。','Export the data carrying the original properties.'),option('Format-List の縦表示を Export-Csv に渡す。','Pass the Format-List result to Export-Csv.','それは表示用データで、サービスの元の項目ではありません。','That is formatting data, not the original service properties.'),option('Format-Table の列幅を広げてから Export-Csv に渡す。','Widen Format-Table columns before passing its result to Export-Csv.','列幅を変えても、流れるものは表示用データです。','Changing the column width does not change the formatting-record type.'))});

  add({id:'preview-file-change',track:'objects',title:t('変更前に WhatIf','Preview a change with WhatIf'),goal:t('予告と実際の変更を区別する。','Distinguish a preview from an actual change.'),explanation:[t('-WhatIf に対応するコマンドは、実施予定の操作を説明して実際の変更を行いません。すべてのコマンドに付けられる指定ではありません。','Commands supporting -WhatIf describe a proposed operation without applying the change. Not every command supports it.'),t('WhatIf は操作の対象を確かめる助けです。実行時の権限、利用者の影響、成功まで保証するものではありません。今回は削除を予告するだけで、実際には消しません。','WhatIf helps identify the proposed target. It does not guarantee permissions, impact, or eventual success. In this exercise, preview deletion without deleting the file.')],task:t('C:\\Lab\\notes.txt の Remove-Item を -WhatIf で予告し、Test-Path でファイルが残っていることを確認してください。','Preview Remove-Item for C:\\Lab\\notes.txt with -WhatIf, then use Test-Path to verify the file remains.'),example:{command:c`Remove-Item -Path C:\Lab\readme.txt -WhatIf`,note:t('WhatIf のメッセージは、削除済みという意味ではありません。','A WhatIf message does not mean the file was deleted.')},hints:[t('Remove-Item に -WhatIf を付けます。','Add -WhatIf to Remove-Item.'),t('予告の後に Test-Path で存在を確かめます。','After the preview, check existence with Test-Path.'),t('Remove-Item C:\\Lab\\notes.txt -WhatIf の後、Test-Path C:\\Lab\\notes.txt を実行します。','Run Remove-Item C:\\Lab\\notes.txt -WhatIf, then Test-Path C:\\Lab\\notes.txt.')],solution:[c`Remove-Item -Path C:\Lab\notes.txt -WhatIf`,c`Test-Path -Path C:\Lab\notes.txt`],success:t('変更せずに対象を確認し、ファイルが残ることも確かめました。','You previewed the target and verified the file remained.'),verify:{orderedCommands:[path('Remove-Item',c`C:\Lab\notes.txt`,['What if'],['-WhatIf']),path('Test-Path',c`C:\Lab\notes.txt`,['True'])],files:[{path:c`C:\Lab\notes.txt`,includes:['Ticket 1042']}]},question:quiz('WhatIf の出力の意味は？','What does the WhatIf output mean?',option('実行予定を示した。削除はまだ行っていない。','It describes the proposed operation; deletion has not occurred.','True と読み戻しも、ファイルが残ることを裏付けます。','The existence check also confirms that the file remains.'),option('削除後に復元する予定まで自動作成された。','It also scheduled automatic restoration after deletion.','WhatIf は復元予約やバックアップではありません。','WhatIf is not a backup or scheduled restore.'),option('操作を実行したが、画面には予告形式で表示した。','The operation was applied but displayed as a preview.','-WhatIf は実際の変更を行わない指定です。','-WhatIf prevents the actual change.'))});

  add({id:'import-csv',track:'data',title:t('CSV をオブジェクトへ','Read CSV as objects'),goal:t('文字列の一覧と、列名を持つデータを区別する。','Distinguish text lines from data with named columns.'),explanation:[t('Get-Content は CSV をテキストとして読みます。Import-Csv は先頭の列名を項目名にし、行ごとのオブジェクトを返します。','Get-Content reads CSV as text. Import-Csv uses its column headers as property names and returns one object per row.'),t('CSV の値は通常、文字列として取り込まれます。8 のように数字に見える値も、数値として比較するなら型を確認します。','CSV values normally arrive as strings. Even a value that looks numeric, such as 8, needs attention before numeric comparison.')],task:t('C:\\Lab\\devices.csv を Import-Csv で読み、Name と FreeGB を選んで表示してください。','Import C:\\Lab\\devices.csv and display Name and FreeGB.'),example:{command:c`Get-Content -Path C:\Lab\devices.csv`,note:t('これは文字列として読む例です。課題では Import-Csv を使います。','This reads text. Use Import-Csv for the task.')},hints:[t('Import-Csv に -Path を指定します。','Pass -Path to Import-Csv.'),t('Select-Object で Name,FreeGB を選びます。','Select Name,FreeGB with Select-Object.'),t('Import-Csv C:\\Lab\\devices.csv | Select-Object Name,FreeGB です。','Run Import-Csv C:\\Lab\\devices.csv | Select-Object Name,FreeGB.')],solution:[c`Import-Csv -Path C:\Lab\devices.csv | Select-Object -Property Name,FreeGB`],success:t('列の名前を使ってデータを扱えました。','You used column names to work with the data.'),verify:{pipelines:[[path('Import-Csv',c`C:\Lab\devices.csv`),cmd('Select-Object',['Name,FreeGB'],['PC-014','PC-021','PC-032'])]]},question:quiz('Import-Csv が返した FreeGB の値は？','What type of value does Import-Csv provide for FreeGB?',option('数字に見えても、取り込んだ値は文字列。','The imported values are strings, even when they look numeric.','数値の大小比較には明示的な型変換を使えます。','Use explicit conversion for numeric comparisons.'),option('列名に GB が付くため、自動的に数値になる。','The GB suffix in the column name makes it numeric.','列名からデータ型を推測して変換することはありません。','A column’s name does not make its values numeric.'),option('同じ列に整数しかないので、配列全体が整数型になる。','Because the column contains integers, the entire array becomes integer typed.','Import-Csv の列値は通常、文字列として扱います。','Import-Csv normally provides string property values.'))});

  add({id:'numeric-csv-filter',track:'data',title:t('数字を数値として比較する','Compare numeric values as numbers'),goal:t('明示的な型変換で容量不足の候補を抽出する。','Use explicit conversion to find low-space candidates.'),explanation:[t('[int] は整数への型変換です。{ [int]$_.FreeGB -lt 10 } は現在の行の FreeGB を整数にして、10 より小さいか比較します。','[int] converts a value to an integer. { [int]$_.FreeGB -lt 10 } converts the current row’s FreeGB before comparing it with 10.'),t('文字列同士の並びと、数値の大小は同じではありません。CSV の内容が空欄や数字以外なら、別途検証が必要です。この教材の値は整数でそろえています。','Text ordering and numeric ordering differ. Empty or nonnumeric CSV fields need validation. This exercise uses integer values throughout.')],task:t('devices.csv から、FreeGB が数値として 10 未満の PC を抽出してください。','Filter devices.csv to PCs whose numeric FreeGB is less than 10.'),example:{command:c`Import-Csv C:\Lab\devices.csv | Where-Object { [int]$_.FreeGB -lt 20 }`,note:t('しきい値を課題に合わせて変えます。','Change the threshold to match the task.')},hints:[t('Import-Csv から Where-Object へ渡します。','Pipe Import-Csv to Where-Object.'),t('条件の左側に [int]$_.FreeGB と書きます。','Use [int]$_.FreeGB on the left of the comparison.'),t('Import-Csv C:\\Lab\\devices.csv | Where-Object { [int]$_.FreeGB -lt 10 } です。','Run Import-Csv C:\\Lab\\devices.csv | Where-Object { [int]$_.FreeGB -lt 10 }.')],solution:[c`Import-Csv -Path C:\Lab\devices.csv | Where-Object { [int]$_.FreeGB -lt 10 }`],success:t('文字列を数値へ変換して、2 台の候補を抽出できました。','You converted strings to numbers and found two candidates.'),verify:{pipelines:[[path('Import-Csv',c`C:\Lab\devices.csv`),{...cmd('Where-Object',[],['PC-014','PC-032']),outputExcludes:['PC-021'],outputCount:2}]]}});

  add({id:'search-log',track:'data',title:t('ログから手がかりを探す','Find evidence in a log'),goal:t('Select-String の結果に含まれる場所と行を読む。','Read the file and line information from Select-String.'),explanation:[t('Select-String はテキストの検索です。-SimpleMatch はパターンを正規表現として扱わず、その文字列を探します。出力には行番号と一致行などが含まれます。','Select-String searches text. -SimpleMatch searches for the literal pattern rather than a regular expression. Results include information such as the line number and matching line.'),t('ERROR という文字を見つけても、現在の状態や原因が確定するわけではありません。時刻、前後の行、現在のサービス状態と合わせて読みます。','Finding ERROR does not establish the current state or root cause. Read timestamps, surrounding context, and current service status too.')],task:t('app.log から文字列 ERROR を Select-String -SimpleMatch で探してください。','Search app.log for the literal string ERROR with Select-String -SimpleMatch.'),example:{command:c`Select-String -Path C:\Lab\Logs\app.log -Pattern INFO -SimpleMatch`,note:t('検索語を ERROR に変えます。','Change the pattern to ERROR.')},hints:[t('-Path にログ、-Pattern に検索語を書きます。','Use -Path for the log and -Pattern for the search text.'),t('文字列そのものを探すため -SimpleMatch を付けます。','Add -SimpleMatch for a literal search.'),t('Select-String -Path C:\\Lab\\Logs\\app.log -Pattern ERROR -SimpleMatch です。','Run Select-String -Path C:\\Lab\\Logs\\app.log -Pattern ERROR -SimpleMatch.')],solution:[c`Select-String -Path C:\Lab\Logs\app.log -Pattern ERROR -SimpleMatch`],success:t('一致した行と、その場所を特定できました。','You located matching lines and their positions.'),verify:{commands:[{...path('Select-String',c`C:\Lab\Logs\app.log`,['Print service unavailable','Job failed'],['ERROR','-SimpleMatch']),outputCount:2}]}});

  add({id:'large-files',track:'data',title:t('大きいファイルを探す','Find larger files'),goal:t('再帰的な取得とサイズによる抽出を組み合わせる。','Combine recursive enumeration with a size filter.'),explanation:[t('Get-ChildItem -File -Recurse は子フォルダーのファイルも取得します。Length はバイトなので、しきい値の単位をそろえます。今回は小さな練習用データで 200 バイトを使います。','Get-ChildItem -File -Recurse includes files in subfolders. Length is measured in bytes, so keep the threshold’s unit consistent. This small fixture uses a 200-byte threshold.'),t('大きいファイルが見つかっても、削除してよいとは限りません。所有者、用途、保管要件を確認するための一覧として使います。','Finding a large file does not make it safe to delete. Use the list to investigate ownership, purpose, and retention requirements.')],task:t('C:\\Lab 以下のファイルから Length が 200 より大きいものを抽出し、Length の大きい順に並べてください。','Find files under C:\\Lab with Length greater than 200, then sort by Length descending.'),example:{command:c`Get-ChildItem -Path C:\Lab -File -Recurse`,note:t('取得範囲を広げてから、条件と順序を指定します。','After expanding the search scope, add the condition and ordering.')},hints:[t('-Recurse を付けて子フォルダーを含めます。','Use -Recurse to include descendants.'),t('Where-Object { $_.Length -gt 200 } で抽出します。単純な条件なら Where-Object Length -gt 200 とも書けます。','Filter with Where-Object { $_.Length -gt 200 }. For this simple condition, Where-Object Length -gt 200 is equivalent.'),t('最後に Sort-Object Length -Descending をつなぎます。','Finish with Sort-Object Length -Descending.')],solution:[c`Get-ChildItem -Path C:\Lab -File -Recurse | Where-Object { $_.Length -gt 200 } | Sort-Object -Property Length -Descending`],success:t('対象範囲、条件、順序を組み合わせて調べられました。','You combined scope, condition, and order.'),verify:{pipelines:[[path('Get-ChildItem',c`C:\Lab`,[],['-File','-Recurse']),cmd('Where-Object',['Length','-gt','200']),cmd('Sort-Object',['Length','-Descending'],['archive.log'])]]}});

  add({id:'capstone-capacity-report',track:'data',title:t('総合演習：容量の確認対象を報告','Investigation: report low-space candidates'),goal:t('条件で抽出し、必要な項目を保存して、報告の範囲を説明する。','Filter, save selected properties, and explain the scope of the report.'),explanation:[t('問い合わせ：「一覧に載っている PC のうち、空き容量が 10 GB 未満のものを担当者へ渡したい」。配布 CSV を使うため、ここでは実 PC の現在値を取得していません。','Request: “Send the support team the listed PCs with less than 10 GB free.” You are using a supplied CSV, not querying live PCs.'),t('数値へ変換して条件を適用し、Name と FreeGB を CSV 保存します。保存先を読み戻し、対象と項目が意図どおりかを確かめます。','Convert the values for comparison, select Name and FreeGB, and export CSV. Reimport it to verify the intended devices and properties.')],task:t('devices.csv から FreeGB が数値として 10 未満の行を選び、Name と FreeGB を Reports\\low-space.csv に保存して読み戻し、報告として適切な説明を選んでください。','Filter devices.csv to numeric FreeGB below 10. Save Name and FreeGB to Reports\\low-space.csv, import it again, and choose an accurate report.'),example:{command:c`Import-Csv -Path C:\Lab\devices.csv`,note:t('まず入力データを確認します。','Start by inspecting the input data.')},hints:[t('Where-Object { [int]$_.FreeGB -lt 10 } を使います。','Use Where-Object { [int]$_.FreeGB -lt 10 }.'),t('Select-Object Name,FreeGB から Export-Csv へ渡します。','Pipe Select-Object Name,FreeGB to Export-Csv.'),t('Reports\\low-space.csv へ -NoTypeInformation -Encoding utf8 で保存し、Import-Csv で読み戻します。','Export to Reports\\low-space.csv with -NoTypeInformation -Encoding utf8, then reimport it.')],solution:[c`Import-Csv -Path C:\Lab\devices.csv | Where-Object { [int]$_.FreeGB -lt 10 } | Select-Object -Property Name,FreeGB | Export-Csv -Path C:\Lab\Reports\low-space.csv -NoTypeInformation -Encoding utf8`,c`Import-Csv -Path C:\Lab\Reports\low-space.csv`],success:t('再利用できる一覧と、調査範囲が明確な報告ができました。','You produced a reusable list and a report with a clear scope.'),verify:{pipelines:[[path('Import-Csv',c`C:\Lab\devices.csv`),{...cmd('Where-Object',[],['PC-014','PC-032']),outputExcludes:['PC-021'],outputCount:2},cmd('Select-Object',['Name,FreeGB']),path('Export-Csv',c`C:\Lab\Reports\low-space.csv`)]],commands:[{...path('Import-Csv',c`C:\Lab\Reports\low-space.csv`,['PC-014','PC-032']),outputExcludes:['PC-021'],outputCount:2}],files:[{path:c`C:\Lab\Reports\low-space.csv`,includes:['Name','FreeGB','PC-014','PC-032']}]},question:quiz('この一覧と一緒に伝える説明は？','Which explanation should accompany the report?',option('配布 CSV では 2 台が条件に一致。現在の空き容量は未照会。','Two rows in the supplied CSV match; current disk space has not been queried.','入力資料を加工した結果と、実機の現在値を分けています。','This distinguishes processing the supplied data from measuring current PCs.'),option('2 台の PC に接続し、現在の容量不足を確認済み。','We connected to two PCs and verified their current low disk space.','実行したのは CSV の読み込みで、PC への接続ではありません。','The commands read a CSV; they did not connect to the PCs.'),option('2 台の不要ファイルを削除し、空き容量が回復済み。','Unneeded files were deleted on two PCs and space has recovered.','抽出と保存だけでは、ファイル削除や復旧は行われません。','Filtering and exporting do not delete files or recover disk space.'))});

  add({id:'inspect-process',track:'pc',title:t('プロセスを名前と ID で調べる','Identify a process by name and ID'),goal:t('名前と ID を照合して、今回の実行を特定する。','Match a name with an ID to identify the current instance.'),explanation:[t('Get-Process -Name はプロセス名で、-Id は PID で調べます。ProcessName は通常、実行ファイルの .exe を付けない名前です。','Get-Process -Name filters by process name; -Id selects a PID. ProcessName normally omits the executable’s .exe extension.'),t('ID は現在の実行を識別します。アプリを起動し直すと変わり得るため、前回の番号をそのまま再利用しません。','An ID identifies a running instance. It can change after restarting the app, so do not reuse a previously noted PID without checking.')],task:t('NotesApp を名前で調べ、表示された ID 4320 を指定してもう一度確認してください。','Find NotesApp by name, then query its displayed ID 4320.'),example:{command:'Get-Process -Name explorer',note:t('調べるアプリ名を NotesApp に変えます。','Use NotesApp for the task.')},hints:[t('Get-Process -Name NotesApp を使います。','Use Get-Process -Name NotesApp.'),t('Id の欄を読みます。','Read the Id property.'),t('Get-Process -Id 4320 で同じ名前が返るか確認します。','Run Get-Process -Id 4320 and check the name.')],solution:['Get-Process -Name NotesApp','Get-Process -Id 4320'],success:t('名前と ID を照合して対象を確認できました。','You matched the name and ID of the target.'),verify:{commands:[cmd('Get-Process',['-Name','NotesApp'],['4320']),cmd('Get-Process',['-Id','4320'],['NotesApp'])]}});

  add({id:'filter-memory',track:'pc',title:t('メモリの値を比べる','Compare memory values'),goal:t('単位を確かめてメモリ使用量を絞り込む。','Check units before filtering memory usage.'),explanation:[t('WorkingSet64 はプロセスのワーキングセットをバイト数で表す項目です。PowerShell の数値サフィックス MB は 1024 × 1024 倍を表します。200MB は 200 MiB = 209715200 バイトです。今回はこの値を超えるものを抽出します。','WorkingSet64 describes a process working set in bytes. PowerShell’s numeric MB suffix multiplies by 1024 × 1024, so 200MB is 200 MiB, or 209715200 bytes. Filter for values above that threshold.'),t('大きな値は調査の手がかりです。一度の取得だけでメモリリークとは判断できません。用途や時間変化、ほかの状態を合わせて調べます。','A large value is a clue, not proof of a memory leak. Consider workload, changes over time, and other observations.')],task:t('Get-Process から WorkingSet64 が 200MB（209715200 バイト）を超えるものを抽出し、ProcessName と WorkingSet64 を表示してください。','Filter Get-Process to WorkingSet64 greater than 200MB (209715200 bytes), and display ProcessName and WorkingSet64.'),example:{command:'Get-Process | Select-Object ProcessName,WorkingSet64',note:t('項目の値を見てから、条件を追加します。','Inspect the property values, then add the condition.')},hints:[t('Where-Object WorkingSet64 -gt 200MB を使います。バイト数を直接書いても同じです。','Use Where-Object WorkingSet64 -gt 200MB. Writing the byte count directly is equivalent.'),t('最後に必要な 2 項目を選びます。','Select the two requested properties last.'),t('Get-Process | Where-Object { $_.WorkingSet64 -gt 200MB } | Select-Object ProcessName,WorkingSet64 とも書けます。','You can also write Get-Process | Where-Object { $_.WorkingSet64 -gt 200MB } | Select-Object ProcessName,WorkingSet64.')],solution:['Get-Process | Where-Object WorkingSet64 -gt 200MB | Select-Object ProcessName,WorkingSet64'],success:t('単位をそろえて候補を抽出できました。','You used a consistent unit to identify a candidate.'),verify:{pipelines:[[cmd('Get-Process'),cmd('Where-Object',['WorkingSet64','-gt','209715200']),{...cmd('Select-Object',['ProcessName,WorkingSet64'],['NotesApp']),outputCount:1}]]},question:quiz('NotesApp の値が大きいことから言えるのは？','What follows from NotesApp having a large value?',option('この時点でしきい値を超えている。原因の判断には追加観察が必要。','It exceeds the threshold in this snapshot; the cause needs more evidence.','一回の値と、時間を追った増加は別の観察です。','A single value and growth over time are different observations.'),option('値が大きいため、メモリリークと特定できた。','The large value identifies a memory leak.','用途や時間変化をまだ確認していません。','Workload and changes over time have not been checked.'),option('この値だけで、OS 全体の空きメモリが分かる。','This value gives the OS’s total free memory.','これはプロセスの項目です。OS の空き容量は別の情報です。','This is a process property, not the OS’s free-memory value.'))});

  add({id:'preview-process-stop',track:'pc',title:t('終了の対象を予告する','Preview a process stop'),goal:t('終了する前に対象を見直し、実行と予告を区別する。','Review the target before stopping it and distinguish a preview from execution.'),explanation:[t('Stop-Process はプロセスを終了させます。未保存データを失う可能性があるため、対象と影響の確認が必要です。この課題では -WhatIf だけを使います。','Stop-Process terminates a process. Unsaved work can be lost, so check the target and impact. This exercise uses -WhatIf only.'),t('予告後にも同じ ID が取得できるか確かめると、今回の操作が終了を実行していないことを確認できます。','Querying the same ID after the preview lets you check that the process was not stopped.')],task:t('NotesApp を取得し、その ID 4320 の停止を -WhatIf で予告して、もう一度 ID 4320 を取得してください。','Find NotesApp, preview stopping ID 4320 with -WhatIf, then query ID 4320 again.'),example:{command:'Stop-Process -Id 4320 -WhatIf',note:t('この課題では -WhatIf を外しません。','Keep -WhatIf in this exercise.')},hints:[t('最初に Get-Process -Name NotesApp を実行します。','Start with Get-Process -Name NotesApp.'),t('Stop-Process -Id 4320 -WhatIf を使います。','Use Stop-Process -Id 4320 -WhatIf.'),t('最後に Get-Process -Id 4320 で対象が残ることを確認します。','Finish with Get-Process -Id 4320 to verify it remains.')],solution:['Get-Process -Name NotesApp','Stop-Process -Id 4320 -WhatIf','Get-Process -Id 4320'],success:t('対象の確認と、変更していないことの再確認ができました。','You checked the target and verified that no change was applied.'),verify:{orderedCommands:[cmd('Get-Process',['NotesApp']),cmd('Stop-Process',['4320','-WhatIf'],['What if']),cmd('Get-Process',['-Id','4320'],['NotesApp'])],state:{'pc.processes.0.Id':4320}}});

  add({id:'stop-one-process',track:'pc',title:t('確認したアプリだけを終了する','Stop the verified app'),goal:t('終了前の照合と終了後の確認を一組にする。','Pair target verification with a check after stopping.'),explanation:[t('この演習では NotesApp の作業は保存済みで、利用者から終了の了解を得ています。確認したプロセスを ID、名前、またはパイプで指定します。名前指定は同名のプロセスすべてが対象になるため、この演習では NotesApp が一件だけであることを確認します。実際の環境では権限や業務への影響も確認します。','For this exercise, the user has saved their work and approved stopping NotesApp. Target the verified process by ID, name, or pipeline input. A name can match multiple running instances, so verify that this exercise has only one NotesApp process. In a real environment, check permissions and operational impact too.'),t('Stop-Process は通常、成功しても表示がありません。無言を成功の証拠にせず、Get-Process で対象がなくなったことを再確認します。','Stop-Process normally produces no output on success. Treat silence as insufficient evidence and query the process list again.')],task:t('NotesApp を名前で確認し、ID 4320 のプロセスを停止してから、全プロセスを取得して対象が一覧から消えたことを確かめてください。','Find NotesApp by name, stop the process with ID 4320, then query all processes and verify it is absent.'),example:{command:'Get-Process -Name NotesApp',note:t('終了操作より先に対象を確認します。','Verify the target before stopping it.')},hints:[t('Get-Process -Name NotesApp で ID を確かめます。','Check the ID with Get-Process -Name NotesApp.'),t('Stop-Process -Id 4320、Stop-Process -Name NotesApp、または Get-Process -Name NotesApp | Stop-Process で対象を停止します。','Stop the target with Stop-Process -Id 4320, Stop-Process -Name NotesApp, or Get-Process -Name NotesApp | Stop-Process.'),t('最後は引数なしの Get-Process で残ったプロセスを表示します。','Finish with Get-Process without arguments to list remaining processes.')],solution:['Get-Process -Name NotesApp','Stop-Process -Id 4320','Get-Process'],success:t('確認した一件だけを終了し、結果を再確認できました。','You stopped the verified instance and checked the result.'),verify:{orderedCommands:[cmd('Get-Process',['NotesApp']),afterChange({...cmd('Stop-Process',['4320']),argsExcludes:['-WhatIf']}),{...cmd('Get-Process',[],['explorer','pwsh']),argsEqual:[],outputExcludes:['NotesApp']}],state:{'pc.processes.0.ProcessName':'explorer'}}});

  add({id:'inspect-service',track:'pc',title:t('サービスの状態と起動設定','Service status and startup mode'),goal:t('現在の状態と、起動方法の設定を区別する。','Distinguish current status from startup configuration.'),session:{scenario:'service-stopped'},explanation:[t('Get-Service はサービスの状態を返します。Status は今の状態、StartType は起動方法の設定です。Automatic でも、停止していることがあります。','Get-Service reports service information. Status is current state; StartType is startup configuration. An automatic service can be stopped.'),t('この環境では印刷サービス Spooler が停止しています。まず状態と設定を読む練習です。開始操作は次の課題で扱います。','In this scenario, the Print Spooler is stopped. First practice reading its status and configuration; a later lesson covers starting it.')],task:t('Spooler の Name、Status、StartType を選び、現在の状態と設定を読み取ってください。','Select Name, Status, and StartType for Spooler and interpret its state and configuration.'),example:{command:'Get-Service -Name Spooler',note:t('見たい項目を Select-Object で指定します。','Choose the needed properties with Select-Object.')},hints:[t('対象は Get-Service -Name Spooler です。','Use Get-Service -Name Spooler.'),t('Select-Object Name,Status,StartType をつなぎます。','Pipe to Select-Object Name,Status,StartType.'),t('Get-Service -Name Spooler | Select-Object Name,Status,StartType です。','Run Get-Service -Name Spooler | Select-Object Name,Status,StartType.')],solution:['Get-Service -Name Spooler | Select-Object Name,Status,StartType'],success:t('設定と現在状態を分けて読めました。','You distinguished the configuration from the present state.'),verify:{pipelines:[[cmd('Get-Service',['Spooler']),cmd('Select-Object',['Name,Status,StartType'],['Stopped','Automatic'])]]},question:quiz('この出力をどう説明する？','How would you describe this output?',option('自動起動の設定だが、現在は停止している。','Startup is automatic, but it is currently stopped.','Automatic と Stopped は別の項目の値なので両立します。','Automatic and Stopped describe different properties and can coexist.'),option('自動起動なので、現在も印刷サービスは稼働中。','It must be running because startup is automatic.','現在状態は Status の Stopped を読みます。','Read Stopped in Status for the current state.'),option('現在停止中なので、起動設定は Disabled。','Its startup mode must be Disabled because it is stopped.','表示された StartType は Automatic です。','The displayed StartType is Automatic.'))});

  add({id:'start-service',track:'pc',title:t('サービス開始後に確かめる','Verify after starting a service'),goal:t('状態確認・開始・再確認を順番に行う。','Observe, start, and verify in order.'),session:{scenario:'service-stopped'},explanation:[t('この演習では停止理由を担当者と確認し、Spooler を開始する許可があります。Start-Service は実環境では管理者権限などが必要になる操作です。','For this exercise, the reason for the stop has been reviewed and starting Spooler is approved. In real environments, Start-Service can require administrative privileges.'),t('開始後はサービスの状態を再取得します。Running はサービス稼働の確認であり、実際の印刷成功は別の確認です。','Query the service again after starting it. Running verifies service state; a successful print job is a separate check.')],task:t('Spooler の停止を確認し、Start-Service で開始して、Get-Service で Running を確認してください。','Confirm Spooler is stopped, start it with Start-Service, then verify Running with Get-Service.'),example:{command:'Start-Service -Name Spooler -WhatIf',note:t('予告だけでは課題は完了しません。許可済みの開始を実行して再確認します。','A preview does not complete this task. Apply the approved start and verify it.')},hints:[t('最初に Get-Service -Name Spooler を実行します。','Start with Get-Service -Name Spooler.'),t('Start-Service -Name Spooler で開始します。','Start it with Start-Service -Name Spooler.'),t('最後に Get-Service -Name Spooler を再実行します。','Run Get-Service -Name Spooler again at the end.')],solution:['Get-Service -Name Spooler','Start-Service -Name Spooler','Get-Service -Name Spooler'],success:t('開始前と開始後の状態を確認できました。','You verified state before and after starting the service.'),verify:{orderedCommands:[cmd('Get-Service',['Spooler'],['Stopped']),afterChange({...cmd('Start-Service',['Spooler']),argsExcludes:['-WhatIf']}),cmd('Get-Service',['Spooler'],['Running'])],state:{'pc.services.0.Status':'Running'}}});

  add({id:'system-information',track:'pc',title:t('OS の情報を取得する','Collect operating-system information'),goal:t('CIM で取得した情報の項目を選ぶ。','Select properties from a CIM query.'),explanation:[t('Get-CimInstance は管理情報をクラス名で問い合わせます。Win32_OperatingSystem は OS の情報です。今回はローカル PC の情報を取得します。','Get-CimInstance queries management data by class name. Win32_OperatingSystem provides OS information. This exercise queries the local PC.'),t('取得できる項目には OS 名、版、最終起動時刻などがあります。CIM クラスや必要な権限は環境で異なり、この教材は指定されたクラスだけを再現します。','Properties include the OS caption, version, and last boot time. Classes and permissions vary by environment; this room implements only its documented classes.')],task:t('Win32_OperatingSystem を取得し、Caption、Version、LastBootUpTime を選んでください。','Query Win32_OperatingSystem and select Caption, Version, and LastBootUpTime.'),example:{command:'Get-CimInstance -ClassName Win32_OperatingSystem',note:t('必要な項目をこの後に選びます。','Select the desired properties after the query.')},hints:[t('-ClassName に Win32_OperatingSystem を指定します。','Pass Win32_OperatingSystem to -ClassName.'),t('Select-Object で 3 項目を選びます。','Use Select-Object for the three properties.'),t('Get-CimInstance -ClassName Win32_OperatingSystem | Select-Object Caption,Version,LastBootUpTime です。','Run Get-CimInstance -ClassName Win32_OperatingSystem | Select-Object Caption,Version,LastBootUpTime.')],solution:['Get-CimInstance -ClassName Win32_OperatingSystem | Select-Object Caption,Version,LastBootUpTime'],success:t('問い合わせに必要な OS 情報を取得できました。','You collected useful OS details for a support report.'),verify:{pipelines:[[cmd('Get-CimInstance',['Win32_OperatingSystem']),cmd('Select-Object',['Caption,Version,LastBootUpTime'],['Windows','Version','LastBootUpTime'])]]}});

  add({id:'disk-free-space',track:'pc',title:t('空き容量を調べる','Inspect free disk space'),goal:t('ディスク容量とファイルサイズを区別する。','Distinguish disk free space from file sizes.'),session:{scenario:'low-disk'},explanation:[t('Win32_LogicalDisk の FreeSpace は空き容量、Size はドライブ容量で、どちらもバイト数です。DeviceID で C: や D: を区別します。','Win32_LogicalDisk exposes FreeSpace and Size in bytes. DeviceID identifies drives such as C: or D:.'),t('ファイル一覧で見える Length の合計は、ドライブの空き容量と同じ情報ではありません。隠れた領域や対象外のフォルダーもあるためです。','Summing file Length values is not the same measurement as drive free space; there can be other folders and storage areas.')],task:t('Win32_LogicalDisk から DeviceID が C: の行だけを選び、DeviceID、FreeSpace、Size を表示してください。','Query Win32_LogicalDisk, keep DeviceID C:, and display DeviceID, FreeSpace, and Size.'),example:{command:'Get-CimInstance -ClassName Win32_LogicalDisk',note:t('複数のドライブから対象を選びます。','Choose the intended drive from the results.')},hints:[t('Where-Object DeviceID -eq C: で選びます。','Filter with Where-Object DeviceID -eq C:.'),t('Select-Object で DeviceID,FreeSpace,Size を選びます。','Select DeviceID,FreeSpace,Size.'),t('Get-CimInstance -ClassName Win32_LogicalDisk | Where-Object DeviceID -eq C: | Select-Object DeviceID,FreeSpace,Size の形です。','Use Get-CimInstance -ClassName Win32_LogicalDisk | Where-Object DeviceID -eq C: | Select-Object DeviceID,FreeSpace,Size.')],solution:['Get-CimInstance -ClassName Win32_LogicalDisk | Where-Object DeviceID -eq C: | Select-Object DeviceID,FreeSpace,Size'],success:t('対象ドライブと数値の意味を区別できました。','You identified the drive and distinguished the two capacity values.'),verify:{pipelines:[[cmd('Get-CimInstance',['Win32_LogicalDisk']),cmd('Where-Object',['DeviceID','-eq','C:']),{...cmd('Select-Object',['DeviceID,FreeSpace,Size'],['C:','2147483648']),outputCount:1}]]},question:quiz('FreeSpace の 2147483648 は何を表す？','What does FreeSpace 2147483648 represent?',option('C: の空き容量をバイトで表した値。','Free space on C:, expressed in bytes.','この値は 2 GiB です。Size は別の容量の項目です。','This is 2 GiB. Size is a separate capacity property.'),option('C: にある最大ファイルのバイト数。','The byte length of the largest file on C:.','これはドライブの情報で、個別ファイルの Length ではありません。','This is drive data, not a file’s Length.'),option('C: の使用済み容量をバイトで表した値。','Used space on C:, expressed in bytes.','FreeSpace は使用済みではなく空き容量です。','FreeSpace is available space, not used space.'))});

  add({id:'read-system-events',track:'pc',title:t('最近のイベントを読む','Read recent system events'),goal:t('イベントの時刻・ID・メッセージを合わせて読む。','Read event time, ID, and message together.'),session:{scenario:'service-stopped'},explanation:[t('Get-WinEvent は Windows のイベントログを取得します。-LogName System でログを選び、-MaxEvents 3 で件数を絞ります。既定では新しいイベントから取得します。件数を指定しない実機では大量のログが表示されることがあります。この教材は 12 件の架空ログです。Select-Object -First 3 でも先頭の 3 件を選べます。','Get-WinEvent reads Windows event logs. -LogName System chooses a log and -MaxEvents 3 limits the count. Results are newest first by default. On a real machine, omitting the limit can display many events. This room contains 12 fictional events. Select-Object -First 3 can also keep the latest three.'),t('ログは過去に起きたことの記録です。停止の記録があっても、現在も停止しているかは Get-Service で確かめます。この教材のイベントは固定した架空データで、メッセージは学習用に簡略化しています。','Logs record past events. A stop event does not establish current service status; query Get-Service for that. These events are fixed fictional data with messages simplified for learning.')],task:t('System ログの最新 3 件を取得し、TimeCreated、Id、Message を表示してください。','Get the latest three System events and display TimeCreated, Id, and Message.'),example:{command:'Get-WinEvent -LogName System -MaxEvents 1',note:t('課題では件数を 3 にして、表示する項目を選びます。','Use a count of 3 and choose the requested properties.')},hints:[t('-LogName System -MaxEvents 3 を指定します。','Specify -LogName System -MaxEvents 3.'),t('Select-Object TimeCreated,Id,Message をつなぎます。','Pipe to Select-Object TimeCreated,Id,Message.'),t('Get-WinEvent -LogName System -MaxEvents 3 | Select-Object TimeCreated,Id,Message です。','Run Get-WinEvent -LogName System -MaxEvents 3 | Select-Object TimeCreated,Id,Message.')],solution:['Get-WinEvent -LogName System -MaxEvents 3 | Select-Object TimeCreated,Id,Message'],success:t('時刻と内容を持つ調査の手がかりを取得できました。','You collected timestamped evidence for the investigation.'),verify:{pipelines:[displayedEvents()]},question:quiz('Spooler 停止のイベントから、現在の状態は分かる？','Does a Spooler stop event establish its current status?',option('その時刻の停止は分かる。現在状態は別に取得する。','It records a stop at that time; query current status separately.','ログと現在状態は時間の対象が違います。','The event and current-state query refer to different times.'),option('最新 3 件に停止があれば、現在も停止中と確定する。','A stop among the latest three events proves it is still stopped.','その後の変化や別ログの記録がある可能性があります。','Later changes or records elsewhere may exist.'),option('停止イベントを読み出すと、サービスも停止する。','Reading the stop event also stops the service.','Get-WinEvent は取得操作で、サービス変更は行いません。','Get-WinEvent reads data; it does not change the service.'))});

  add({id:'save-pc-inventory',track:'pc',title:t('端末情報を共有できる形にする','Save a shareable PC inventory'),goal:t('端末名と所属の情報を CSV にまとめる。','Export computer name and domain information as CSV.'),explanation:[t('Win32_ComputerSystem は端末の名前や所属ドメインなどの情報を持ちます。今回はローカルの架空 PC 一台を調べます。','Win32_ComputerSystem contains information such as computer name and domain. This exercise inspects one fictional local PC.'),t('Domain の表示だけで、ドメインコントローラーへ現在接続できるとは断定できません。構成の情報と到達性は分けて報告します。','A Domain value alone does not verify current connectivity to a domain controller. Report configuration separately from reachability.')],task:t('Win32_ComputerSystem の Name と Domain を Reports\\pc.csv に CSV 保存し、読み戻してください。','Export Name and Domain from Win32_ComputerSystem to Reports\\pc.csv, then import it again.'),example:{command:'Get-CimInstance -ClassName Win32_ComputerSystem | Select-Object Name,Domain',note:t('この結果を CSV 保存します。','Export this result as CSV.')},hints:[t('Get-CimInstance で対象クラスを取得します。','Query the class with Get-CimInstance.'),t('Name,Domain を選んで Export-Csv へ渡します。','Select Name,Domain and pipe to Export-Csv.'),t('C:\\Lab\\Reports\\pc.csv に保存し、Import-Csv で読み戻します。','Save to C:\\Lab\\Reports\\pc.csv and reimport it.')],solution:[c`Get-CimInstance -ClassName Win32_ComputerSystem | Select-Object Name,Domain | Export-Csv -Path C:\Lab\Reports\pc.csv -NoTypeInformation -Encoding utf8`,c`Import-Csv -Path C:\Lab\Reports\pc.csv`],success:t('端末の構成情報を保存し、再利用できることを確認しました。','You saved configuration information and verified its reuse.'),verify:{pipelines:[[cmd('Get-CimInstance',['Win32_ComputerSystem']),cmd('Select-Object',['Name,Domain']),path('Export-Csv',c`C:\Lab\Reports\pc.csv`)]],commands:[path('Import-Csv',c`C:\Lab\Reports\pc.csv`,['PC-014','corp.example'])],files:[{path:c`C:\Lab\Reports\pc.csv`,includes:['Name','Domain','PC-014','corp.example']}]}});

  add({id:'network-configuration',track:'network',title:t('接続と IP 設定を見る','Inspect adapters and IP configuration'),goal:t('アダプターの状態と IP 設定を対応させる。','Relate adapter status to IP configuration.'),explanation:[t('Get-NetAdapter はアダプターの状態、Get-NetIPConfiguration は IP アドレスやゲートウェイなどを表示します。どの接続の値なのか、InterfaceAlias も確認します。','Get-NetAdapter shows adapter status; Get-NetIPConfiguration shows addresses, gateways, and related configuration. Check InterfaceAlias to identify the connection.'),t('これらは Windows のネットワーク用コマンドです。PowerShell 7 自体が別 OS で動いても、このモジュールが同じようにあるとは限りません。設定があることと、宛先へ接続できることも別です。','These are Windows networking cmdlets. PowerShell 7 also runs on other systems, but these modules are not necessarily present there. Configured values are separate from verified connectivity.')],task:t('Get-NetAdapter と Get-NetIPConfiguration を実行して、接続の状態・IP・ゲートウェイを確認してください。','Run Get-NetAdapter and Get-NetIPConfiguration to inspect adapter status, IP address, and gateway.'),example:{command:'Get-NetAdapter',note:t('アダプターの状態から調査を始めます。','Begin with the adapter status.')},hints:[t('まず Get-NetAdapter を実行します。','Start with Get-NetAdapter.'),t('次に Get-NetIPConfiguration です。','Next run Get-NetIPConfiguration.'),t('10.20.0.14 とゲートウェイ 10.20.0.1 がどの接続にあるか読みます。','Check which connection has 10.20.0.14 and gateway 10.20.0.1.')],solution:['Get-NetAdapter','Get-NetIPConfiguration'],success:t('接続の状態と設定値を対応させられました。','You related adapter state to its configuration.'),verify:{commands:[cmd('Get-NetAdapter',[],['Up']),cmd('Get-NetIPConfiguration',[],['10.20.0.14','10.20.0.1'])]}});

  add({id:'dns-resolution',track:'network',title:t('DNS 設定と回答を分ける','Separate DNS configuration from answers'),goal:t('DNS サーバーの設定と名前解決の結果を確認する。','Check configured DNS servers and a name-resolution result.'),explanation:[t('Get-DnsClientServerAddress は DNS サーバーの設定を表示します。Resolve-DnsName は名前を問い合わせ、回答を取得します。設定を表示しただけでは、回答できるかは分かりません。','Get-DnsClientServerAddress displays configured DNS servers. Resolve-DnsName queries a name and returns an answer. Reading configuration does not verify that the server answers.'),t('この演習の社内ポータルは intranet.corp.example、期待する回答は 10.20.0.20 です。名前が引けても、その先の TCP や HTTP は別に確認します。','The fictional portal is intranet.corp.example, with expected address 10.20.0.20. Successful name resolution does not verify TCP or HTTP.')],task:t('DNS サーバー設定を表示し、intranet.corp.example の名前を解決してください。','Display the configured DNS servers, then resolve intranet.corp.example.'),example:{command:'Resolve-DnsName -Name files.corp.example',note:t('課題ではポータルの名前を指定します。','Use the portal name for the task.')},hints:[t('Get-DnsClientServerAddress を使います。','Run Get-DnsClientServerAddress.'),t('Resolve-DnsName の -Name に名前を指定します。','Pass the name to Resolve-DnsName -Name.'),t('Resolve-DnsName -Name intranet.corp.example を実行します。','Run Resolve-DnsName -Name intranet.corp.example.')],solution:['Get-DnsClientServerAddress','Resolve-DnsName -Name intranet.corp.example'],success:t('設定と名前解決の回答を別々に取得できました。','You collected DNS configuration and the actual answer separately.'),verify:{commands:[cmd('Get-DnsClientServerAddress',[],['10.20.0.10']),cmd('Resolve-DnsName',['intranet.corp.example'],['10.20.0.20'])]},question:quiz('10.20.0.20 が返った時点で確認できたことは？','What does the returned 10.20.0.20 verify?',option('この問い合わせでは、名前からアドレスの回答が得られた。','This query obtained an address answer for the name.','Web の動作や認証は、まだ確認していません。','Web behavior and authentication have not been checked.'),option('Web サービスのログイン画面が正常に表示された。','The web service’s login page displayed successfully.','DNS の回答は HTTP の画面表示ではありません。','A DNS answer is not an HTTP page response.'),option('同じアドレスの TCP 443 への接続に成功した。','A TCP connection to port 443 on that address succeeded.','ポートへの接続試験はまだ実施していません。','A connection test to that port has not yet been performed.'))});

  add({id:'icmp-check',track:'network',title:t('ICMP の応答を見る','Check ICMP replies'),goal:t('Test-Connection が何を調べているか理解する。','Understand what Test-Connection tests.'),explanation:[t('Test-Connection は ICMP の応答を調べます。-Count は試行回数です。PowerShell の版で出力の形やパラメーター名が異なり、この教材は 7 系の -TargetName を使います。','Test-Connection checks ICMP replies. -Count sets the number of attempts. Output and parameter names differ across editions; this room uses PowerShell 7’s -TargetName.'),t('ICMP の応答がなくても、通信先や経路で ICMP だけが制限されている場合があります。応答がある場合も、アプリの通信を確認したことにはなりません。','Missing replies can mean ICMP is filtered along the path or at the destination. Receiving replies still does not verify an application connection.')],task:t('intranet.corp.example へ Test-Connection を 2 回試してください。','Use Test-Connection for two attempts to intranet.corp.example.'),example:{command:'Test-Connection -TargetName example.com -Count 1',note:t('宛先と回数を課題に合わせて変えます。','Change the target and count for the task.')},hints:[t('宛先指定は -TargetName です。','Use -TargetName for the destination.'),t('試行回数は -Count 2 です。','Use -Count 2.'),t('Test-Connection -TargetName intranet.corp.example -Count 2 を実行します。','Run Test-Connection -TargetName intranet.corp.example -Count 2.')],solution:['Test-Connection -TargetName intranet.corp.example -Count 2'],success:t('ICMP の観察範囲を理解して結果を取得できました。','You collected ICMP evidence while understanding its scope.'),verify:{commands:[cmd('Test-Connection',['intranet.corp.example','-Count','2'],['10.20.0.20'])]}});

  add({id:'tcp-check',track:'network',title:t('必要なポートへの接続を試す','Test the required TCP port'),goal:t('ICMP と TCP 接続の結果を区別する。','Distinguish ICMP evidence from a TCP connection test.'),explanation:[t('Test-NetConnection -Port 443 は TCP 443 への接続を試します。TcpTestSucceeded の True / False を読みます。これは Windows の NetTCPIP モジュールのコマンドです。','Test-NetConnection -Port 443 tests a TCP connection to port 443. Read TcpTestSucceeded. This cmdlet belongs to Windows’s NetTCPIP module.'),t('True でも、TLS 証明書や HTTP の応答、ログインの成否を確認したことにはなりません。TCP の次にアプリの層を調べます。','True does not verify a TLS certificate, HTTP response, or login. After TCP, inspect the application layer.')],task:t('intranet.corp.example の TCP 443 に接続できるか調べてください。','Test a TCP connection to port 443 on intranet.corp.example.'),example:{command:'Test-NetConnection -ComputerName files.corp.example -Port 445',note:t('ファイル共有のポートを試す例です。課題ではポータルの 443 です。','This tests a file-sharing port. Test the portal’s 443 for the task.')},hints:[t('Test-NetConnection に宛先とポートを指定します。','Specify the destination and port with Test-NetConnection.'),t('ポートの指定は -Port 443 です。','Use -Port 443.'),t('Test-NetConnection -ComputerName intranet.corp.example -Port 443 です。','Run Test-NetConnection -ComputerName intranet.corp.example -Port 443.')],solution:['Test-NetConnection -ComputerName intranet.corp.example -Port 443'],success:t('必要な TCP ポートの接続結果を確認できました。','You verified the connection result for the required TCP port.'),verify:{commands:[cmd('Test-NetConnection',['intranet.corp.example','-Port','443'],['TcpTestSucceeded','True'])]},question:quiz('TcpTestSucceeded が True なら？','What does TcpTestSucceeded True establish?',option('指定した宛先とポートへの TCP 接続が成立した。','A TCP connection to the specified target and port succeeded.','アプリの内容や認証は、この試験の範囲外です。','Application content and authentication are outside this test’s scope.'),option('ポータルが HTTP 200 を返した。','The portal returned HTTP 200.','HTTP 要求はまだ送っていません。','No HTTP request has been tested yet.'),option('利用者のアカウントでログインできた。','The user successfully logged in.','この試験はログイン処理を行っていません。','This test does not perform a login.'))});

  add({id:'http-response',track:'network',title:t('HTTP 応答を確認する','Inspect an HTTP response'),goal:t('Invoke-WebRequest の状態コードを読む。','Read the status code from Invoke-WebRequest.'),explanation:[t('Invoke-WebRequest は HTTP 要求を送り、状態コードやヘッダー、内容などを持つ応答オブジェクトを返します。-Method Head は本文を取得せずヘッダーを要求します。','Invoke-WebRequest sends an HTTP request and returns a response object with status, headers, and content. -Method Head requests headers without the response body.'),t('この教材では実際の通信をせず、登録済みの宛先だけを再現します。200 はこの要求の成功で、ページの全機能や利用者のログインまで検証したわけではありません。','This room simulates only registered targets and makes no network requests. A 200 means this request succeeded; it does not validate every page feature or user login.')],task:t('https://intranet.corp.example へ HEAD 要求を送り、StatusCode を選んで表示してください。','Send a HEAD request to https://intranet.corp.example and display StatusCode.'),example:{command:'Invoke-WebRequest -Uri https://example.com -Method Head',note:t('課題では社内ポータルへ宛先を変えます。','Use the intranet portal for the task.')},hints:[t('Invoke-WebRequest の -Uri に URL を指定します。','Pass the URL to -Uri.'),t('-Method Head を付けます。','Add -Method Head.'),t('Invoke-WebRequest -Uri https://intranet.corp.example -Method Head | Select-Object StatusCode です。','Run Invoke-WebRequest -Uri https://intranet.corp.example -Method Head | Select-Object StatusCode.')],solution:['Invoke-WebRequest -Uri https://intranet.corp.example -Method Head | Select-Object StatusCode'],success:t('HTTP の応答まで進み、状態コードを確認できました。','You reached the HTTP layer and inspected its status code.'),verify:{pipelines:[[cmd('Invoke-WebRequest',['https://intranet.corp.example','-Method','Head']),cmd('Select-Object',['StatusCode'],['200'])]]}});

  add({id:'rest-data',track:'network',title:t('API の値を取り出す','Extract values from an API'),goal:t('HTTP 応答の本文を、項目を持つデータとして読む。','Read an HTTP response body as structured data.'),explanation:[t('Invoke-RestMethod は、JSON などの応答本文を解析してオブジェクトとして扱えます。Invoke-WebRequest の応答全体の情報と、API が返す本文の値を区別します。','Invoke-RestMethod can parse response bodies such as JSON into objects. Distinguish API body values from the full response information provided by Invoke-WebRequest.'),t('この演習の /api/status は service、status、queue を返します。status が ok でも、その API が何を測っているかを越えて推測しないようにします。','The simulated /api/status endpoint returns service, status, and queue. An ok value applies to what that API reports; avoid assuming it verifies more.')],task:t('https://intranet.corp.example/api/status を Invoke-RestMethod で取得し、service、status、queue を選んでください。','Query https://intranet.corp.example/api/status with Invoke-RestMethod and select service, status, and queue.'),example:{command:'Invoke-RestMethod -Uri https://intranet.corp.example/api/status',note:t('返ってきた項目をパイプで選びます。','Use the pipeline to select returned properties.')},hints:[t('API の URL は /api/status まで指定します。','Include /api/status in the URL.'),t('Select-Object service,status,queue をつなぎます。','Pipe to Select-Object service,status,queue.'),t('Invoke-RestMethod -Uri https://intranet.corp.example/api/status | Select-Object service,status,queue です。','Run Invoke-RestMethod -Uri https://intranet.corp.example/api/status | Select-Object service,status,queue.')],solution:['Invoke-RestMethod -Uri https://intranet.corp.example/api/status | Select-Object service,status,queue'],success:t('API の返したデータを項目名で読めました。','You read the API’s data by property name.'),verify:{pipelines:[[cmd('Invoke-RestMethod',['https://intranet.corp.example/api/status']),cmd('Select-Object',['service,status,queue'],['Helpdesk','ok','3'])]]}});
